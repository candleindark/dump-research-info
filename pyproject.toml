[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dump-research-info"
dynamic = ["version"]
description = 'A tool that dumps research information related to Center for Open Neuroscience to an instance of dump-things-server'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "Isaac To", email = "candleindark@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "httpx",
  "pydantic",
  "typer",
]

[project.urls]
Documentation = "https://github.com/Isaac To/dump-research-info#readme"
Issues = "https://github.com/Isaac To/dump-research-info/issues"
Source = "https://github.com/Isaac To/dump-research-info"

[project.scripts]
dump-research-info = "dump_research_info.cli:app"

[tool.hatch.version]
path = "src/dump_research_info/__about__.py"

[dependency-groups]
test = ["pytest", "pytest-asyncio"]
types = [{include-group = "test"}, "mypy>=1.0.0"]
dev = [{include-group = "test"}]

[tool.hatch.envs.default]
installer = "uv"
python = "3.11"

[tool.hatch.envs.test]
dependency-groups = ["test"]
[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"

[tool.hatch.envs.dev]
dependency-groups = ["dev"]

[tool.hatch.envs.dump-server]
installer = "uv"
detached = true
dependencies = [
  "dump-things-service",
]
[tool.hatch.envs.dump-server.scripts]
start = 'dump-things-service --origins "http://localhost:8000" --host localhost --port 8111 "{root}/store"'

[tool.hatch.envs.tools]
installer = "uv"
detached = true
[tool.hatch.envs.tools.scripts]
serve-frontend = 'python -m http.server --directory "{root}/_ext/pool.psychoinformatics.de-ui/dist" 8000'

[tool.hatch.envs.types]
dependency-groups = ["types"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/dump_research_info tests}"

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["dump_research_info", "tests"]
branch = true
parallel = true
omit = [
  "src/dump_research_info/__about__.py",
]

[tool.coverage.paths]
dump_research_info = ["src/dump_research_info", "*/dump-research-info/src/dump_research_info"]
tests = ["tests", "*/dump-research-info/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
