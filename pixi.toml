[workspace]
name = "dump-research-info"
version = "0.1.0"
description = "Reproducible CON research-information ingestion"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"

[tasks]
zotero-fetch = "python scripts/zotero_ingest.py fetch --output inputs/zotero_centerforopenneuroscience/snapshot.json"
zotero-candidates = "python scripts/zotero_ingest.py transform --input inputs/zotero_centerforopenneuroscience/snapshot.json --output-dir build/zotero_centerforopenneuroscience --report build/zotero_centerforopenneuroscience-report.json --people data/con_site/XYZPerson.json --organizations data/con_site/XYZOrganization.json --topics data/pool_psychoinformatics_de/XYZTopic.json --existing-data-root data"
zotero-refresh = { depends-on = ["zotero-fetch", "zotero-candidates"] }
validation-server = 'dump-things-service --origins "http://localhost:8000" --host localhost --port 8111 "store"'
validate-zotero = "python scripts/validate_records.py data/zotero_centerforopenneuroscience --report build/zotero-validation-report.json"
validate-data = "python scripts/validate_records.py data/* --report build/data-validation-report.json"
site-build = "python scripts/build_site.py --data-root data --site-root site --output build/site --report build/site-merge-report.json --base-path /"
site-serve = "python -m http.server --directory build/site 8000"
con-site-refresh = "python scripts/con_site_ingest.py --refresh"
con-site-audit = "python scripts/con_site_ingest.py"
con-site-check = "python scripts/con_site_ingest.py --check"

[pypi-dependencies]
dump-things-service = ">=5.6, <6"
jinja2 = ">=3.1, <4"
beautifulsoup4 = ">=4.13, <5"
