name: Site CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked Pixi environment
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.66.0
          frozen: true
          cache: true

      - name: Validate all Things v2 records
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/validation-server.log"
          pixi run validation-server >"$log_file" 2>&1 &
          validator_pid=$!
          trap 'kill "$validator_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8111/openapi.json >/dev/null; then
              break
            fi
            if ! kill -0 "$validator_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$log_file"
              echo "The local Things validation service did not become ready." >&2
              exit 1
            fi
            sleep 1
          done

          pixi run validate-data

      - name: Check pinned source audit reports
        run: pixi run con-site-check

      - name: Check reviewed research slices
        run: pixi run research-slices-check

      - name: Build the static site
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          base_path="/$repository_name/"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base_path="/$repository_name/pr-preview/pr-${{ github.event.pull_request.number }}/"
          fi

          pixi run python scripts/apply_merge_policy.py \
            --data-root data \
            --policy site/merge-policy.yaml \
            --output build/policy-data \
            --report build/site-policy-report.json

          pixi run python scripts/build_site.py \
            --data-root build/policy-data \
            --site-root site \
            --output build/site \
            --report build/site-merge-report.json \
            --base-path "$base_path"

          pixi run python scripts/build_editorial.py \
            --content site/content/editorial.yaml \
            --template site/templates/editorial_page.html \
            --output build/site \
            --base-path "$base_path"

      - name: Upload generated site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: build/site
          if-no-files-found: error
          retention-days: 7

      - name: Upload merge report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-merge-report
          path: |
            build/site-merge-report.json
            build/site-policy-report.json
          if-no-files-found: error
          retention-days: 14

  deploy-main:
    name: Deploy main site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-branch-deployment
      cancel-in-progress: false
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: build/site

      - name: Publish main site while retaining previews
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: build/site
          clean: true
          clean-exclude: pr-preview
          force: false
          commit-message: Deploy site for ${{ github.sha }}
