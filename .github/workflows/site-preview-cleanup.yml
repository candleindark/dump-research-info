name: Remove site preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  remove-preview:
    name: Remove closed pull request preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: pages-branch-deployment
      cancel-in-progress: false
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove preview and update its pull request comment
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          pr-number: ${{ github.event.pull_request.number }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: true
          qr-code: false
          remove-commit-message: Remove preview for PR ${{ github.event.pull_request.number }}
