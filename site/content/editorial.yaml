pages:
  about:
    title: Center for Open Neuroscience
    eyebrow: Open tools. Reusable knowledge. Better science.
    lead: We provide open software frameworks, platforms, data, and methodologies for neuroscience and
      beyond.
    sections:
    - title: Our principles
      layout: cards
      items:
      - title: Open Source
        body:
        - Open source is not only an efficient paradigm for scalability and collaboration; it facilitates
          verification and reproducibility.
        - We advocate open-source principles and consult scientific developers on licensing and sustainable
          development practices.
      - title: Re-Use & Integration
        body:
        - Scientific communities already share powerful software and data. We develop products that harness,
          improve, and integrate existing solutions rather than reinventing them.
      - title: Dissemination
        body:
        - Scientific software often lacks the facilities and funding needed for reliable promotion and
          distribution.
        - We help distribute software, data, and documentation while giving careful attention to intellectual
          property and due acknowledgment.
      - title: Quality Assurance
        body:
        - Research developers are not always programmers by training. We establish unit, regression, integration,
          and validity testing so scientific tools produce robust, correct results.
      - title: Convenience
        body:
        - Reliability and accessibility only matter at scale when software and data are convenient to
          use. We reduce the complexity that prevents communities from using shared resources.
      - title: Community
        body:
        - Neuroscience projects are often pursued in isolation. We participate in cross-disciplinary initiatives
          and build bridges between previously disconnected research groups.
    - title: References
      layout: links
      body:
      - These publications frame the center's approach to open and reproducible neuroscience.
      links:
      - label: 'Open and reproducible neuroimaging: from study inception to publication'
        url: https://doi.org/10.1016/j.neuroimage.2022.119623
      - label: Four aspects to make science open by design and not as an after-thought
        url: https://doi.org/10.1186/s13742-015-0072-7
      - label: Open is not enough. Let's take the next step
        url: https://doi.org/10.3389/fninf.2012.00022
    - title: A long view
      layout: quote
      body:
      - Together we can make neuroscience a better science.
